[project]
name = "agent-cookbook"
version = "0.1.0"
description = "LLM Agent 实战指南：从工作流到自主 Agent 的完整教程"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "grandalf>=0.8",
    "instructor>=1.15.4",
    "langchain>=1.3.13",
    "langchain-openai>=1.3.5",
    "langgraph>=1.2.0",
    "langgraph-checkpoint-sqlite>=1.0.0",
    "langsmith>=0.10.2",
    "pygraphviz>=2.0",
    "python-dotenv>=1.0",
    "jupyter",
    "ipykernel",
    "deepagents>=0.7.1",
    "langchain-community>=0.3.0",
    "langchain-experimental>=0.4.0",
    "textual>=0.80.0",
    "typesafe-sdk>=0.7.0",
]

[project.scripts]
# 事件驱动 agent 系列（正文 books/event-driven-agent/，代码 src/baby_event_driven_agent/）。
# 每个 stage 一条 demo + 一条 test：demo 指向该 stage 的 main.py；
# test 指向该 stage 的 testing.py（包内 pytest.main）。
stage01-demo = "baby_event_driven_agent.stages.stage01_receive_events.main:cli"
stage01-test = "baby_event_driven_agent.stages.stage01_receive_events.testing:main"
stage02-demo = "baby_event_driven_agent.stages.stage02_inbox_steering.main:cli"
stage02-test = "baby_event_driven_agent.stages.stage02_inbox_steering.testing:main"
stage03-demo = "baby_event_driven_agent.stages.stage03_interrupt.main:cli"
stage03-test = "baby_event_driven_agent.stages.stage03_interrupt.testing:main"
stage04-demo = "baby_event_driven_agent.stages.stage04_message_bus.main:cli"
stage04-test = "baby_event_driven_agent.stages.stage04_message_bus.testing:main"
stage05-demo = "baby_event_driven_agent.stages.stage05_session.main:cli"
stage05-test = "baby_event_driven_agent.stages.stage05_session.testing:main"

# 用 asciinema 把某个 stage 的 demo case 逐个录成 .cast（见 recorder.py）。
cookbook-rec = "baby_event_driven_agent.recorder:cli"

[build-system]
requires = ["setuptools>=75.0"]
build-backend = "setuptools.build_meta"

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[tool.setuptools.packages.find]
# 只装 src/：examples/ 放 notebook 与演练代码，不参与包发现，
# 否则 setuptools 会把 examples 下的 langgraph / python / dsh / pi 注册成顶层包，遮蔽真正的依赖。
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["src/baby_agent/tests", "src/baby_event_driven_agent/tests"]
pythonpath = ["src"]
