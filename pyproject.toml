[project]
name = "agent-cookbook"
version = "0.1.0"
description = "LLM Agent 实战指南：从工作流到自主 Agent 的完整教程"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "grandalf>=0.8",
    "instructor>=1.15.4",
    "langchain>=1.3.13",
    "langchain-openai>=1.3.5",
    "langgraph>=1.2.0",
    "langgraph-checkpoint-sqlite>=1.0.0",
    "langsmith>=0.10.2",
    "pygraphviz>=2.0",
    "python-dotenv>=1.0",
    "jupyter",
    "ipykernel",
    "deepagents>=0.7.1",
    "langchain-community>=0.3.0",
    "langchain-experimental>=0.4.0",
    "textual>=0.80.0",
]

[build-system]
requires = ["setuptools>=75.0"]
build-backend = "setuptools.build_meta"

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["src/baby_agent/tests"]
pythonpath = ["src"]
